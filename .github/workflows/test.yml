name: Test action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    name: self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start local test targets
        run: bash test/start-targets.sh

      - name: Healthy target with fail-on none
        id: healthy
        uses: ./
        with:
          domain: http://127.0.0.1:4601
          fail-on: none

      - name: Upload the report named by the report-path output
        uses: actions/upload-artifact@v7
        with:
          name: unpwned-report-${{ matrix.os }}
          path: ${{ steps.healthy.outputs.report-path }}
          if-no-files-found: error
          retention-days: 3

      - name: Blocked target fails by default
        id: blocked
        continue-on-error: true
        uses: ./
        with:
          domain: http://127.0.0.1:4602
          fail-on: none

      - name: Blocked target with fail-on-blocked false
        id: blocked-allowed
        uses: ./
        with:
          domain: http://127.0.0.1:4602
          fail-on: none
          fail-on-blocked: 'false'

      - name: Low score with fail-on none
        id: weak
        uses: ./
        with:
          domain: http://127.0.0.1:4603
          fail-on: none

      - name: Critical finding with fail-on critical
        id: weak-critical
        continue-on-error: true
        uses: ./
        with:
          domain: http://127.0.0.1:4603
          fail-on: critical

      - name: Domain input that looks like an option
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          domain: '--help'

      - name: Target that refuses the connection
        id: unreachable
        continue-on-error: true
        uses: ./
        with:
          domain: http://127.0.0.1:4609
          fail-on: none

      - name: Check results
        env:
          HEALTHY_SCORE: ${{ steps.healthy.outputs.score }}
          HEALTHY_GRADE: ${{ steps.healthy.outputs.grade }}
          HEALTHY_BLOCKED: ${{ steps.healthy.outputs.blocked }}
          BLOCKED_OUTCOME: ${{ steps.blocked.outcome }}
          BLOCKED_FLAG: ${{ steps.blocked.outputs.blocked }}
          BLOCKED_REASON: ${{ steps.blocked.outputs.block-reason }}
          ALLOWED_OUTCOME: ${{ steps.blocked-allowed.outcome }}
          ALLOWED_FLAG: ${{ steps.blocked-allowed.outputs.blocked }}
          WEAK_OUTCOME: ${{ steps.weak.outcome }}
          WEAK_SCORE: ${{ steps.weak.outputs.score }}
          WEAK_CRITICAL_OUTCOME: ${{ steps.weak-critical.outcome }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          UNREACHABLE_OUTCOME: ${{ steps.unreachable.outcome }}
        run: bash test/check-results.sh

  pr-comment:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-comment-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start local test targets
        run: bash test/start-targets.sh

      - name: Note the start time
        id: clock
        run: echo "started-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Comment for a healthy target
        uses: ./
        with:
          domain: http://127.0.0.1:4601
          fail-on: none
          comment-on-pr: true

      - name: Comment for a blocked target
        uses: ./
        with:
          domain: http://127.0.0.1:4602
          fail-on: none
          fail-on-blocked: 'false'
          comment-on-pr: true

      - name: Check and remove the test comments
        if: ${{ always() && steps.clock.outputs.started-at != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.clock.outputs.started-at }}
        run: bash test/check-comments.sh

  released-tag:
    name: released-tag (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start local test targets
        run: bash test/start-targets.sh

      - name: Healthy target through the v1 tag
        id: healthy
        uses: razazu/unpwned-action@v1
        with:
          domain: http://127.0.0.1:4601
          fail-on: none

      - name: Upload the report named by the report-path output
        uses: actions/upload-artifact@v7
        with:
          name: unpwned-report-v1-${{ matrix.os }}
          path: ${{ steps.healthy.outputs.report-path }}
          if-no-files-found: error
          retention-days: 3

      - name: Blocked target through the v1 tag
        id: blocked
        continue-on-error: true
        uses: razazu/unpwned-action@v1
        with:
          domain: http://127.0.0.1:4602
          fail-on: none

      - name: Check that v1 runs the current release
        env:
          HEALTHY_SCORE: ${{ steps.healthy.outputs.score }}
          BLOCKED_OUTCOME: ${{ steps.blocked.outcome }}
          BLOCKED_FLAG: ${{ steps.blocked.outputs.blocked }}
          BLOCKED_REASON: ${{ steps.blocked.outputs.block-reason }}
        run: |
          set -euo pipefail
          case "$HEALTHY_SCORE" in
            '' | *[!0-9]*)
              echo "::error::v1 reported no score for the healthy target ('$HEALTHY_SCORE')."
              exit 1
              ;;
          esac
          if [ "$BLOCKED_OUTCOME" != "failure" ] || [ "$BLOCKED_FLAG" != "true" ]; then
            echo "::error::v1 does not report blocked scans (outcome '$BLOCKED_OUTCOME', blocked '$BLOCKED_FLAG')."
            exit 1
          fi
          if [ "$BLOCKED_REASON" != "HTTP 403, Cloudflare challenge page" ]; then
            echo "::error::v1 reported an unexpected block reason: '$BLOCKED_REASON'."
            exit 1
          fi
          echo "ok: v1 scored the healthy target $HEALTHY_SCORE and reports blocked scans"
