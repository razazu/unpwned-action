name: 'UNPWNED Security Scan'
description: '8 security checks on every push. Headers, SSL, DNS, cookies, CORS, files, breaches. Fails builds on critical findings.'
author: 'Raz Azulay'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  domain:
    description: 'Domain or URL to scan (e.g. example.com or https://example.com)'
    required: true
  fail-on:
    description: 'Fail the workflow if any finding at this severity or higher exists. Options: critical, high, medium, low, none'
    required: false
    default: 'critical'
  fail-on-blocked:
    description: 'Fail the workflow when the target blocks the scan (WAF, rate limit or challenge page), because the result is then partial. Options: true, false'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Post scan results as a comment on the pull request (requires pull-requests: write permission)'
    required: false
    default: 'false'

outputs:
  score:
    description: 'Overall security score (0-100)'
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: 'Security grade (A+ to F)'
    value: ${{ steps.scan.outputs.grade }}
  critical:
    description: 'Count of critical severity findings'
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: 'Count of high severity findings'
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: 'Count of medium severity findings'
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: 'Count of low severity findings'
    value: ${{ steps.scan.outputs.low }}
  blocked:
    description: 'true when the target blocked the scan and the result is partial, otherwise false'
    value: ${{ steps.scan.outputs.blocked }}
  block-reason:
    description: 'Short description of the block, for example "HTTP 403, Cloudflare challenge page". Empty when the scan was not blocked'
    value: ${{ steps.scan.outputs.block-reason }}
  report-path:
    description: 'Path to the full JSON report artifact'
    value: ${{ steps.scan.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Run UNPWNED scan
      id: scan
      shell: bash
      env:
        UNPWNED_DOMAIN: ${{ inputs.domain }}
      run: |
        set -euo pipefail
        REPORT_PATH="/tmp/unpwned-report.json"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          REPORT_PATH="${RUNNER_TEMP//\\//}/unpwned-report.json"
        fi
        SCAN_LOG="$REPORT_PATH.log"
        DOMAIN_PATTERN='^[A-Za-z0-9][]A-Za-z0-9._~:/?#@!&=%+,[-]*$'

        read_report() {
          jq "$@" "$REPORT_PATH" | tr -d '\r'
        }

        if [[ ! "$UNPWNED_DOMAIN" =~ $DOMAIN_PATTERN ]]; then
          echo "::error::The domain input must be a domain or URL made of URL characters only, starting with a letter or digit."
          exit 1
        fi

        echo "::group::Running UNPWNED scan on $UNPWNED_DOMAIN"
        set +e
        npx -y unpwned@1 scan --json --no-telemetry -- "$UNPWNED_DOMAIN" > "$REPORT_PATH" 2> "$SCAN_LOG"
        CLI_EXIT=$?
        set -e
        cat "$SCAN_LOG"
        echo "::endgroup::"

        if ! jq -e '.scanners | type == "array"' "$REPORT_PATH" > /dev/null 2>&1; then
          REASON=$(grep -m1 '^unpwned:' "$SCAN_LOG" | cut -c10- | tr -d '\r' | sed 's/%/%25/g' || true)
          echo "::error::UNPWNED could not scan the target (exit code $CLI_EXIT). ${REASON:-See the scan log above.}"
          exit 1
        fi

        SCORE=$(read_report -r '.overallScore')
        GRADE=$(read_report -r '.grade')
        CRITICAL=$(read_report '[.scanners[].findings[] | select(.severity == "critical")] | length')
        HIGH=$(read_report '[.scanners[].findings[] | select(.severity == "high")] | length')
        MEDIUM=$(read_report '[.scanners[].findings[] | select(.severity == "medium")] | length')
        LOW=$(read_report '[.scanners[].findings[] | select(.severity == "low")] | length')
        BLOCKED=$(read_report -r 'if .interference then "true" else "false" end')
        BLOCK_REASON=$(read_report -r '
          if .interference then
            "HTTP \(.interference.status), "
            + (if .interference.provider then "\(.interference.provider) " else "" end)
            + (if .interference.reason == "challenge" then "challenge page"
               elif .interference.reason == "rate-limited" then "rate limit"
               else "block page" end)
          else "" end')
        SKIPPED=$(read_report -r '[.scanners[] | select(.skipped == true and (.skipReason // "blocked") == "blocked") | .name] | join(", ")')
        CHECKED=$(read_report '[.scanners[] | select(.skipped != true)] | length')
        TOTAL=$(read_report '[.scanners[] | select((.skipReason // "") != "not-applicable")] | length')

        {
          echo "score=$SCORE"
          echo "grade=$GRADE"
          echo "critical=$CRITICAL"
          echo "high=$HIGH"
          echo "medium=$MEDIUM"
          echo "low=$LOW"
          echo "blocked=$BLOCKED"
          echo "block-reason=$BLOCK_REASON"
          echo "report-path=$REPORT_PATH"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## UNPWNED Security Scan"
          echo ""
          echo "**Target:** \`$UNPWNED_DOMAIN\`"
          if [ "$BLOCKED" = "true" ]; then
            echo "**Partial score:** $SCORE / 100 ($CHECKED of $TOTAL checks)"
            echo ""
            echo "> **The target blocked this scan** ($BLOCK_REASON)."
            echo "> Not checked: $SKIPPED."
            echo "> Allow requests from your CI runners in your WAF to get a full scan."
          else
            echo "**Score:** $SCORE / 100 (Grade $GRADE)"
          fi
          echo ""
          echo "| Severity | Count |"
          echo "|----------|-------|"
          echo "| Critical | $CRITICAL |"
          echo "| High     | $HIGH |"
          echo "| Medium   | $MEDIUM |"
          echo "| Low      | $LOW |"
          echo ""
          echo "Full report with AI fix prompts, PDF export, and continuous monitoring available at [unpwned.io](https://unpwned.io)."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      env:
        UNPWNED_REPORT_PATH: ${{ steps.scan.outputs.report-path }}
        UNPWNED_BLOCK_REASON: ${{ steps.scan.outputs.block-reason }}
      with:
        script: |
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync(process.env.UNPWNED_REPORT_PATH, 'utf8'))
          const score = report.overallScore
          const grade = report.grade
          const counts = { critical: 0, high: 0, medium: 0, low: 0 }
          for (const s of report.scanners) {
            for (const f of s.findings) {
              if (counts[f.severity] !== undefined) counts[f.severity]++
            }
          }
          const blocked = Boolean(report.interference)
          const notChecked = report.scanners
            .filter((s) => s.skipped && (s.skipReason ?? 'blocked') === 'blocked')
            .map((s) => s.name)
          const applicable = report.scanners.filter((s) => s.skipReason !== 'not-applicable').length
          const checked = report.scanners.filter((s) => !s.skipped).length
          const emoji = blocked ? '⚠️' : score >= 80 ? '🟢' : score >= 50 ? '🟡' : '🔴'
          const scoreLines = blocked
            ? [
                `**Partial score:** ${score} / 100 (${checked} of ${applicable} checks)`,
                ``,
                `> **The target blocked this scan** (${process.env.UNPWNED_BLOCK_REASON}).`,
                `> Not checked: ${notChecked.join(', ')}.`,
              ]
            : [`**Score:** ${score} / 100 (Grade ${grade})`]
          const body = [
            `## ${emoji} UNPWNED Security Scan`,
            ``,
            `**Target:** \`${report.target}\``,
            ...scoreLines,
            ``,
            `| Severity | Count |`,
            `|----------|-------|`,
            `| Critical | ${counts.critical} |`,
            `| High     | ${counts.high} |`,
            `| Medium   | ${counts.medium} |`,
            `| Low      | ${counts.low} |`,
            ``,
            `[View full report with AI fix prompts at unpwned.io](https://unpwned.io)`,
          ].join('\n')
          try {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
          } catch (error) {
            if (error.status !== 403) throw error
            core.warning(
              'UNPWNED could not post the pull request comment because the workflow token cannot write to pull requests. Add "permissions: pull-requests: write" to the workflow. A pull request from a fork always gets a read-only token. The results are in the job summary.',
            )
          }

    - name: Evaluate fail threshold
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_BLOCKED: ${{ inputs.fail-on-blocked }}
        BLOCKED: ${{ steps.scan.outputs.blocked }}
        BLOCK_REASON: ${{ steps.scan.outputs.block-reason }}
        CRITICAL: ${{ steps.scan.outputs.critical }}
        HIGH: ${{ steps.scan.outputs.high }}
        MEDIUM: ${{ steps.scan.outputs.medium }}
        LOW: ${{ steps.scan.outputs.low }}
      run: |
        set -euo pipefail

        if [ "$BLOCKED" = "true" ] && [ "$FAIL_ON_BLOCKED" != "false" ]; then
          echo "::error::The target blocked the scan ($BLOCK_REASON), so the result is partial. Allow your CI runners in your WAF, or set fail-on-blocked: false."
          exit 1
        fi

        case "$FAIL_ON" in
          critical)
            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::Found $CRITICAL critical issue(s). Failing workflow (fail-on=critical)."
              exit 1
            fi
            ;;
          high)
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "::error::Found critical or high severity issue(s). Failing workflow (fail-on=high)."
              exit 1
            fi
            ;;
          medium)
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ]; then
              echo "::error::Found medium or higher severity issue(s). Failing workflow (fail-on=medium)."
              exit 1
            fi
            ;;
          low)
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ] || [ "$MEDIUM" -gt 0 ] || [ "$LOW" -gt 0 ]; then
              echo "::error::Found issue(s) at or above low severity. Failing workflow (fail-on=low)."
              exit 1
            fi
            ;;
          none)
            echo "Scan complete. Not failing on any severity (fail-on=none)."
            ;;
          *)
            echo "::warning::Unknown fail-on value. Treating it as 'critical'."
            if [ "$CRITICAL" -gt 0 ]; then exit 1; fi
            ;;
        esac

        echo "Scan passed the fail-on threshold."
